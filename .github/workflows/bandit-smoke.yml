name: Bandit Python security smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TOOLS/security/bandit/**"
      - "TESTS/fixtures/bandit/**"
      - "TESTS/smoke_bandit.py"
      - "scripts/inventory.py"
      - ".github/workflows/bandit-smoke.yml"
  pull_request:
    paths:
      - "TOOLS/security/bandit/**"
      - "TESTS/fixtures/bandit/**"
      - "TESTS/smoke_bandit.py"
      - "scripts/inventory.py"
      - ".github/workflows/bandit-smoke.yml"

permissions:
  contents: read

jobs:
  bandit:
    name: Install Bandit and verify security findings
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install pinned Bandit
        run: |
          python -m pip install --disable-pip-version-check "bandit==1.9.4"
          bandit --version

      - name: Scan safe and intentionally unsafe source fixtures
        run: python TESTS/smoke_bandit.py
