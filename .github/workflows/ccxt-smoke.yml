name: CCXT multi-exchange public API smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "TOOLS/crypto/ccxt/**"
      - "TESTS/smoke_ccxt.py"
      - ".github/workflows/ccxt-smoke.yml"
  push:
    branches: [main]
    paths:
      - "TOOLS/crypto/ccxt/**"
      - "TESTS/smoke_ccxt.py"
      - ".github/workflows/ccxt-smoke.yml"

permissions:
  contents: read

jobs:
  public-api-smoke:
    name: Public market data — BingX primary, Binance/Bybit/OKX secondary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned CCXT
        run: |
          python -m pip install --disable-pip-version-check "ccxt==4.5.94"
          python -c "import ccxt; print('CCXT', ccxt.__version__)"

      - name: Check public market data for selected exchanges
        run: python TESTS/smoke_ccxt.py
