name: FFmpeg media smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TOOLS/media/ffmpeg/**"
      - ".github/workflows/ffmpeg-smoke.yml"
  pull_request:
    paths:
      - "TOOLS/media/ffmpeg/**"
      - ".github/workflows/ffmpeg-smoke.yml"

permissions:
  contents: read

jobs:
  ffmpeg-smoke:
    name: Install FFmpeg and test encode, probe, and decode
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version | head -n 3
          ffprobe -version | head -n 1
          ffmpeg -buildconf

      - name: Generate a short synthetic audio/video file
        run: |
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i "color=c=blue:s=160x90:r=25:d=1" \
            -f lavfi -i "sine=frequency=1000:sample_rate=44100:duration=1" \
            -c:v mpeg4 -q:v 5 -pix_fmt yuv420p \
            -c:a aac -shortest smoke-test.mp4

      - name: Probe streams and decode the output
        run: |
          ffprobe -v error \
            -show_entries format=duration:stream=codec_type,codec_name,width,height,sample_rate \
            -of json smoke-test.mp4 > probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("probe.json").read_text())
          streams = report["streams"]
          video = next((s for s in streams if s["codec_type"] == "video"), None)
          audio = next((s for s in streams if s["codec_type"] == "audio"), None)
          assert video is not None and video["width"] == 160 and video["height"] == 90
          assert audio is not None and audio["sample_rate"] == "44100"
          assert float(report["format"]["duration"]) > 0
          print("ffprobe stream validation: PASS")
          PY
          ffmpeg -hide_banner -loglevel error -i smoke-test.mp4 -f null -
          echo "FFmpeg encode/probe/decode smoke test: PASS"
