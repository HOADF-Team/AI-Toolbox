name: Validate catalog

on:
  pull_request:
    paths:
      - "CATALOG/**"
      - "TOOLS/**"
      - "scripts/validate_catalog.py"
      - ".github/workflows/validate-catalog.yml"
  push:
    branches: [main]
    paths:
      - "CATALOG/**"
      - "TOOLS/**"
      - "scripts/validate_catalog.py"
      - ".github/workflows/validate-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate tool catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog and tool records
        run: python scripts/validate_catalog.py
