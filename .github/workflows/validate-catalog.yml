name: Validate catalog

on:
  pull_request:
    paths:
      - "CATALOG/**"
      - "TOOLS/**"
      - "scripts/**"
      - ".github/workflows/validate-catalog.yml"
  push:
    branches: [main]
    paths:
      - "CATALOG/**"
      - "TOOLS/**"
      - "scripts/**"
      - ".github/workflows/validate-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate tool catalog and Skill map
    runs-on: ubuntu-latest
    steps:
      - name: Check out AI-Toolbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out public Personal-AI-Library main branch
        # Validate against the merged, canonical Skills catalog.
        run: git clone --depth 1 --branch main https://github.com/HOADF-Team/Personal-AI-Library.git Personal-AI-Library
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate catalog and tool records
        run: python scripts/validate_catalog.py
      - name: Validate Skills against the canonical Skill map
        run: python scripts/validate_skill_map.py --skills-root Personal-AI-Library/skills
      - name: Validate crypto-security Skill safety contract
        run: python scripts/validate_crypto_security_skill.py --skill Personal-AI-Library/skills/crypto-security/SKILL.md
