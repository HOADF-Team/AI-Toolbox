name: Crypto research and backtesting smoke tests

on:
  pull_request:
    paths:
      - "TOOLS/crypto/ta-py/**"
      - "TOOLS/crypto/backtesting-py/**"
      - "TESTS/smoke_crypto_research.py"
      - ".github/workflows/crypto-research-smoke.yml"
  push:
    branches: [main]
    paths:
      - "TOOLS/crypto/ta-py/**"
      - "TOOLS/crypto/backtesting-py/**"
      - "TESTS/smoke_crypto_research.py"
      - ".github/workflows/crypto-research-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-smoke:
    name: Pinned install and offline smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install reviewed packages
        run: |
          python -m pip install --disable-pip-version-check "ta_py==2.1.0" "backtesting==0.6.6" pytest
          python -c "import ta_py, backtesting, pandas; print('ta_py installed; backtesting installed; pandas', pandas.__version__)"

      - name: Run deterministic offline smoke tests
        run: python -m pytest -q TESTS/smoke_crypto_research.py
