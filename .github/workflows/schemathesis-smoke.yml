name: Schemathesis API testing smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TOOLS/api-tooling/schemathesis/**"
      - "scripts/inventory.py"
      - ".github/workflows/schemathesis-smoke.yml"
  pull_request:
    paths:
      - "TOOLS/api-tooling/schemathesis/**"
      - "scripts/inventory.py"
      - ".github/workflows/schemathesis-smoke.yml"

permissions:
  contents: read

jobs:
  schemathesis-smoke:
    name: Install Schemathesis and test a local OpenAPI fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and pinned Schemathesis
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install Schemathesis
        run: |
          uv tool install --python 3.13 schemathesis==4.33.1
          schemathesis --version
          python3 scripts/inventory.py --pretty > inventory.json

      - name: Create a local OpenAPI fixture
        shell: bash
        run: |
          cat > openapi.yaml <<'YAML'
          openapi: 3.1.0
          info:
            title: AI-Toolbox Schemathesis smoke fixture
            version: 1.0.0
          paths:
            /items/{item_id}:
              get:
                operationId: getItem
                parameters:
                  - name: item_id
                    in: path
                    required: true
                    schema:
                      type: integer
                      minimum: 1
                      maximum: 5
                responses:
                  "200":
                    description: Item found
                    content:
                      application/json:
                        schema:
                          type: object
                          required: [id, name]
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                  "400":
                    description: Invalid item identifier
                    content:
                      application/json:
                        schema:
                          type: object
                          required: [error]
                          properties:
                            error:
                              type: string
                  "405":
                    description: Method not allowed
          YAML

          cat > server.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  try:
                      item_id = int(self.path.rsplit("/", 1)[-1])
                  except ValueError:
                      self.send_bad_request()
                      return
                  if not 1 <= item_id <= 5:
                      self.send_bad_request()
                      return
                  body = json.dumps({
                      "id": item_id,
                      "name": "fixture-item",
                  }).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def send_bad_request(self):
                  body = json.dumps({"error": "invalid item identifier"}).encode()
                  self.send_response(400)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def method_not_allowed(self):
                  self.send_response(405)
                  self.send_header("Allow", "GET")
                  self.send_header("Content-Length", "0")
                  self.end_headers()

              def __getattr__(self, name):
                  if name.startswith("do_"):
                      return self.method_not_allowed
                  raise AttributeError(name)

              def log_message(self, *_):
                  pass

          HTTPServer(("127.0.0.1", 8766), Handler).serve_forever()
          PY

      - name: Run bounded property-based API checks
        shell: bash
        run: |
          set -euo pipefail
          python3 server.py > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8766/items/1 >/dev/null; then
              break
            fi
            sleep 1
          done

          schemathesis run openapi.yaml \
            --url http://127.0.0.1:8766 \
            --max-examples 10
